<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanabi Download ManagerX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 320px;
            background: linear-gradient(135deg, #000000 0%, #dab9fa 100%);
            color: white;
            overflow: hidden;
        }
        
        .container {
            padding: 24px;
        }
        
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .logo {
            width: 48px;
            height: 48px;
            /* background: rgba(255, 255, 255, 0.2); */
            background: transparent;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            backdrop-filter: blur(10px);
        }
        
        .logo img {
            width: 48px;
            height: 48px;
        }
        
        .title {
            flex: 1;
        }
        
        .title h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        
        .title p {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .status-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .status-label {
            font-size: 13px;
            opacity: 0.9;
        }
        
        .status-value {
            display: flex;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        
        .status-dot.connected {
            background: #4ade80;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
        }
        
        .status-dot.disconnected {
            background: #f87171;
            box-shadow: 0 0 8px rgba(248, 113, 113, 0.6);
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 12px 0;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 6px;
        }
        
        .info-label {
            opacity: 0.8;
        }
        
        .info-value {
            font-weight: 500;
        }
        
        .button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .button-enabled {
            background: rgba(248, 113, 113, 0.3);
            color: white;
            border: 1px solid rgba(248, 113, 113, 0.5);
        }
        
        .button-enabled:hover {
            background: rgba(248, 113, 113, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(248, 113, 113, 0.3);
        }
        
        .button-disabled {
            background: rgba(74, 222, 128, 0.3);
            color: white;
            border: 1px solid rgba(74, 222, 128, 0.5);
        }
        
        .button-disabled:hover {
            background: rgba(74, 222, 128, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 222, 128, 0.3);
        }
        
        .footer {
            text-align: center;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 16px;
        }
        
        body.dark-mode .container {
            background: linear-gradient(135deg, #000000 0%, #dab9fa 100%);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">
            <img src="icon128.png" alt="Hanabi">
        </div>
        <div class="title">
            <h1>Hanabi Download Manager X</h1>
            <p>The New of NsfX Kernel</p>
        </div>
    </div>
    
    <div class="status-card">
        <div class="status-row">
            <span class="status-label">Connection</span>
            <span class="status-value">
                <span class="status-dot disconnected" id="status-dot"></span>
                <span id="status-text">Disconnected</span>
            </span>
        </div>
        
        <div class="divider"></div>
        
        <div class="info-row">
            <span class="info-label">Extension</span>
            <span class="info-value" id="ext-version">v2.0.0</span>
        </div>
        <div class="info-row">
            <span class="info-label">Port</span>
            <span class="info-value">9710</span>
        </div>
        <div class="info-row">
            <span class="info-label">Status</span>
            <span class="info-value" id="ext-status">Enabled</span>
        </div>
    </div>
    
    <button class="button button-enabled" id="toggle-button">
        Disable Extension
    </button>
    
    <div class="footer">
        Hanabi Download ManagerX © 2025
    </div>
</div>

<script src="popup.js"></script>
</body>
</html>

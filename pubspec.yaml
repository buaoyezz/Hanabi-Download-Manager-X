name: hanabi_download_managerx
description: A Modern Download Manager 
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  path: ^1.8.3
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  material_symbols_icons: ^4.2719.1
  flutter_acrylic: ^1.1.4
  fluent_ui: ^4.13.0
  bitsdojo_window: ^0.1.6
  system_tray: ^2.0.3
  file_picker: ^8.1.6
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/logo/logo.png
    - assets/logo/logo.ico

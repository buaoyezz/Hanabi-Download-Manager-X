name: hanabi_download_managerx
description: A EASY AND BEAUTIFUL DOWNLOAD MANAGER
publish_to: 'none'
version: 1.2.10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  uuid: ^3.0.7
  path: ^1.8.3
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  material_symbols_icons: ^4.2719.1
  flutter_acrylic: ^1.1.4
  fluent_ui: ^4.13.0
  bitsdojo_window: ^0.1.6
  system_tray: ^2.0.3
  file_picker: ^8.1.6
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  flutter_markdown: ^0.7.4+3
  win32: ^5.5.0
  ffi: ^2.1.0
  screen_retriever: ^0.1.9
  google_fonts: ^6.1.0
  fl_chart: ^0.69.0
  scroll_animator: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/logo/logo.png
    - assets/logo/logo.ico
    - assets/font/FluentSystemIcons-Regular.json
  
  fonts:
    - family: FluentSystemIcons
      fonts:
        - asset: assets/font/FluentSystemIcons-Regular.ttf

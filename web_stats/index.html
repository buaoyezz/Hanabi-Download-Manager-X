<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanabi Download Manager - 在线统计</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3.4.2/dist/fp.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo-section">
                    <img src="logo.png" alt="Hanabi Logo" class="logo-image">
                    <div class="logo-text">
                        <h1>Hanabi Download Manager</h1>
                        <p>在线用户统计</p>
                    </div>
                </div>
                <div class="status-badge" id="statusBadge">
                    <span class="status-dot"></span>
                    <span class="status-text">连接中...</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Stats Cards Row -->
            <div class="stats-row">
                <div class="card card-gradient">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17 21V19C17 17.9391 16.5786 16.9217 15.8284 16.1716C15.0783 15.4214 14.0609 15 13 15H5C3.93913 15 2.92172 15.4214 2.17157 16.1716C1.42143 16.9217 1 17.9391 1 19V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M9 11C11.2091 11 13 9.20914 13 7C13 4.79086 11.2091 3 9 3C6.79086 3 5 4.79086 5 7C5 9.20914 6.79086 11 9 11Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M23 21V19C22.9993 18.1137 22.7044 17.2528 22.1614 16.5523C21.6184 15.8519 20.8581 15.3516 20 15.13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M16 3.13C16.8604 3.35031 17.623 3.85071 18.1676 4.55232C18.7122 5.25392 19.0078 6.11683 19.0078 7.005C19.0078 7.89318 18.7122 8.75608 18.1676 9.45769C17.623 10.1593 16.8604 10.6597 16 10.88" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="card-content">
                        <div class="card-label">当前在线用户</div>
                        <div class="card-value">
                            <span id="onlineCount" class="count-number">0</span>
                            <span class="count-unit">人</span>
                        </div>
                        <div class="card-subtitle">实时更新中...</div>
                    </div>
                </div>

                <div class="card card-gradient-alt">
                    <div class="card-icon card-icon-alt">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="3" width="7" height="7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <rect x="14" y="3" width="7" height="7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <rect x="14" y="14" width="7" height="7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <rect x="3" y="14" width="7" height="7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="card-content">
                        <div class="card-label">唯一设备数</div>
                        <div class="card-value">
                            <span id="uniqueDevices" class="count-number">0</span>
                            <span class="count-unit">台</span>
                        </div>
                        <div class="card-subtitle">已去重统计</div>
                    </div>
                </div>
            </div>

            <!-- Chart Card -->
            <div class="card">
                <div class="card-header">
                    <div class="card-header-left">
                        <div class="card-header-icon">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 3V21H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M7 16L12 11L16 15L21 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <h2>在线用户趋势</h2>
                    </div>
                    <div class="card-header-right">
                        <span class="data-points-count">最近 <span id="dataPointsCount">0</span> 个数据点</span>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="onlineChart"></canvas>
                </div>
            </div>

            <!-- Statistics Cards -->
            <div class="stats-grid">
                <div class="stat-card stat-card-success">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 19V5M5 12L12 5L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="stat-label">峰值</div>
                    <div class="stat-value" id="maxOnline">0</div>
                </div>

                <div class="stat-card stat-card-warning">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5V19M19 12L12 19L5 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="stat-label">最低</div>
                    <div class="stat-value" id="minOnline">0</div>
                </div>

                <div class="stat-card stat-card-info">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 12H9M21 6H9M21 18H9M5 12C5 12.5523 4.55228 13 4 13C3.44772 13 3 12.5523 3 12C3 11.4477 3.44772 11 4 11C4.55228 11 5 11.4477 5 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="stat-label">平均</div>
                    <div class="stat-value" id="avgOnline">0</div>
                </div>
            </div>

            <!-- Server Info -->
            <div class="card card-info">
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">服务器地址</span>
                        <span class="info-value" id="serverUrl">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">最后更新</span>
                        <span class="info-value" id="lastUpdate">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">数据刷新间隔</span>
                        <span class="info-value">10 秒</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">查看详情</span>
                        <span class="info-value">
                            <a href="devices.html" style="color: var(--color-primary-light); text-decoration: none;">在线设备列表 →</a>
                        </span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Hanabi Download Manager. Powered by ZZBuAoYe.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>

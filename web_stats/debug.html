<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调试页面 - Hanabi 在线统计</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .section {
            background: #2a2a2a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
        }
        .section h3 {
            margin-top: 0;
            color: #60cdff;
        }
        .info-item {
            margin: 5px 0;
            padding: 5px;
            background: #1a1a1a;
            border-radius: 4px;
        }
        .label {
            color: #aaa;
            display: inline-block;
            width: 200px;
        }
        .value {
            color: #6ccb5f;
        }
        .error {
            color: #ff6b6b;
        }
        .success {
            color: #6ccb5f;
        }
        button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #005a9e;
        }
        #log {
            background: #0f0f0f;
            padding: 10px;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 12px;
        }
        .log-entry {
            margin: 2px 0;
            padding: 2px 5px;
        }
        .log-info { color: #60cdff; }
        .log-error { color: #ff6b6b; }
        .log-success { color: #6ccb5f; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3.4.2/dist/fp.min.js"></script>
</head>
<body>
    <h1>🔍 Hanabi 在线统计 - 调试页面</h1>

    <div class="section">
        <h3>设备指纹信息</h3>
        <div class="info-item">
            <span class="label">FingerprintJS 状态:</span>
            <span class="value" id="fpjsStatus">检查中...</span>
        </div>
        <div class="info-item">
            <span class="label">设备指纹:</span>
            <span class="value" id="fingerprint">未生成</span>
        </div>
        <div class="info-item">
            <span class="label">指纹长度:</span>
            <span class="value" id="fingerprintLength">0</span>
        </div>
        <div class="info-item">
            <span class="label">会话 ID:</span>
            <span class="value" id="sessionId">未生成</span>
        </div>
        <div class="info-item">
            <span class="label">浏览器:</span>
            <span class="value" id="browser">-</span>
        </div>
        <div class="info-item">
            <span class="label">操作系统:</span>
            <span class="value" id="os">-</span>
        </div>
        <div class="info-item">
            <span class="label">设备类型:</span>
            <span class="value" id="deviceType">-</span>
        </div>
    </div>

    <div class="section">
        <h3>服务器连接</h3>
        <div class="info-item">
            <span class="label">服务器地址:</span>
            <span class="value" id="serverUrl">http://127.0.0.1:9710</span>
        </div>
        <div class="info-item">
            <span class="label">连接状态:</span>
            <span class="value" id="connectionStatus">未连接</span>
        </div>
        <div>
            <button onclick="testHeartbeat()">测试心跳</button>
            <button onclick="testGetStats()">测试获取统计</button>
            <button onclick="clearLog()">清空日志</button>
        </div>
    </div>

    <div class="section">
        <h3>统计数据</h3>
        <div class="info-item">
            <span class="label">当前在线用户:</span>
            <span class="value" id="currentOnline">-</span>
        </div>
        <div class="info-item">
            <span class="label">唯一设备数:</span>
            <span class="value" id="uniqueDevices">-</span>
        </div>
        <div class="info-item">
            <span class="label">活跃会话:</span>
            <span class="value" id="activeSessions">-</span>
        </div>
    </div>

    <div class="section">
        <h3>日志</h3>
        <div id="log"></div>
    </div>

    <script>
        const SERVER_URL = 'http://127.0.0.1:9710';
        let deviceFingerprint = null;
        let sessionId = null;

        // 日志函数
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // 初始化
        async function init() {
            log('开始初始化...', 'info');
            
            // 检查 FingerprintJS
            if (typeof FingerprintJS === 'undefined') {
                log('❌ FingerprintJS 未加载', 'error');
                document.getElementById('fpjsStatus').textContent = '未加载';
                document.getElementById('fpjsStatus').className = 'error';
                await initFallback();
            } else {
                log('✅ FingerprintJS 已加载', 'success');
                document.getElementById('fpjsStatus').textContent = '已加载';
                document.getElementById('fpjsStatus').className = 'success';
                await initFingerprint();
            }

            // 显示设备信息
            updateDeviceInfo();
        }

        async function initFingerprint() {
            try {
                log('正在生成设备指纹...', 'info');
                const fp = await FingerprintJS.load();
                const result = await fp.get();
                
                deviceFingerprint = result.visitorId;
                sessionId = `${deviceFingerprint}_${Date.now()}`;
                
                log(`✅ 设备指纹: ${deviceFingerprint}`, 'success');
                log(`✅ 会话 ID: ${sessionId}`, 'success');
                
                document.getElementById('fingerprint').textContent = deviceFingerprint;
                document.getElementById('fingerprintLength').textContent = deviceFingerprint.length;
                document.getElementById('sessionId').textContent = sessionId;
            } catch (error) {
                log(`❌ 生成指纹失败: ${error.message}`, 'error');
                await initFallback();
            }
        }

        async function initFallback() {
            log('使用降级方案生成指纹...', 'info');
            const components = [
                navigator.userAgent,
                navigator.language,
                screen.colorDepth,
                screen.width + 'x' + screen.height,
                new Date().getTimezoneOffset(),
                navigator.hardwareConcurrency || 'unknown',
                navigator.platform || 'unknown',
                Date.now().toString(),
            ];
            
            let hash = 0;
            const str = components.join('|');
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            
            const hashStr = Math.abs(hash).toString(36);
            const timestamp = Date.now().toString(36);
            deviceFingerprint = (hashStr + timestamp).padEnd(16, '0');
            sessionId = `${deviceFingerprint}_${Date.now()}`;
            
            log(`✅ 降级指纹: ${deviceFingerprint}`, 'success');
            log(`✅ 会话 ID: ${sessionId}`, 'success');
            
            document.getElementById('fingerprint').textContent = deviceFingerprint;
            document.getElementById('fingerprintLength').textContent = deviceFingerprint.length;
            document.getElementById('sessionId').textContent = sessionId;
        }

        function updateDeviceInfo() {
            const ua = navigator.userAgent;
            let browser = 'Unknown';
            if (ua.indexOf('Firefox') > -1) browser = 'Firefox';
            else if (ua.indexOf('Chrome') > -1) browser = 'Chrome';
            else if (ua.indexOf('Safari') > -1) browser = 'Safari';
            else if (ua.indexOf('Edge') > -1) browser = 'Edge';
            
            let os = 'Unknown';
            if (ua.indexOf('Win') > -1) os = 'Windows';
            else if (ua.indexOf('Mac') > -1) os = 'macOS';
            else if (ua.indexOf('Linux') > -1) os = 'Linux';
            else if (ua.indexOf('Android') > -1) os = 'Android';
            else if (ua.indexOf('iOS') > -1 || ua.indexOf('iPhone') > -1) os = 'iOS';
            
            let deviceType = 'Desktop';
            if (/(tablet|ipad)/i.test(ua)) deviceType = 'Tablet';
            else if (/Mobile|Android|iPhone/i.test(ua)) deviceType = 'Mobile';
            
            document.getElementById('browser').textContent = browser;
            document.getElementById('os').textContent = os;
            document.getElementById('deviceType').textContent = deviceType;
        }

        async function testHeartbeat() {
            if (!sessionId || !deviceFingerprint) {
                log('❌ 无法发送心跳: 缺少会话信息', 'error');
                return;
            }

            log('发送心跳请求...', 'info');
            
            try {
                const payload = {
                    session_id: sessionId,
                    device_fingerprint: deviceFingerprint,
                    device_info: {
                        browser: document.getElementById('browser').textContent,
                        os: document.getElementById('os').textContent,
                        deviceType: document.getElementById('deviceType').textContent,
                        screenResolution: `${screen.width}x${screen.height}`,
                        language: navigator.language,
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    },
                    timestamp: new Date().toISOString(),
                };

                log(`请求数据: ${JSON.stringify(payload, null, 2)}`, 'info');

                const response = await fetch(`${SERVER_URL}/stats/heartbeat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const result = await response.json();
                    log(`✅ 心跳成功: ${JSON.stringify(result)}`, 'success');
                    document.getElementById('connectionStatus').textContent = '已连接';
                    document.getElementById('connectionStatus').className = 'success';
                } else {
                    log(`❌ 心跳失败: ${response.status} ${response.statusText}`, 'error');
                    document.getElementById('connectionStatus').textContent = '连接失败';
                    document.getElementById('connectionStatus').className = 'error';
                }
            } catch (error) {
                log(`❌ 心跳错误: ${error.message}`, 'error');
                document.getElementById('connectionStatus').textContent = '连接错误';
                document.getElementById('connectionStatus').className = 'error';
            }
        }

        async function testGetStats() {
            log('获取统计数据...', 'info');
            
            try {
                const response = await fetch(`${SERVER_URL}/stats/online`);
                
                if (response.ok) {
                    const result = await response.json();
                    log(`✅ 统计数据: ${JSON.stringify(result, null, 2)}`, 'success');
                    
                    if (result.success && result.data) {
                        document.getElementById('currentOnline').textContent = result.data.current_online || 0;
                        document.getElementById('uniqueDevices').textContent = result.data.unique_devices || 0;
                        document.getElementById('activeSessions').textContent = result.data.active_sessions || 0;
                    }
                } else {
                    log(`❌ 获取失败: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                log(`❌ 获取错误: ${error.message}`, 'error');
            }
        }

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

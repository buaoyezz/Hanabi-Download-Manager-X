<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDM-X Browser Extension</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                        <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>HDM-X</h1>
                    <span class="subtitle">智能下载管理</span>
                </div>
            </div>
            <div class="status-indicator" id="status-indicator">
                <div class="status-dot"></div>
            </div>
        </div>

        <!-- Link Detection Section -->
        <div class="link-detection-section">
            <div class="link-detection-card" id="link-detection-card">
                <div class="detection-header">
                    <div class="detection-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path d="M10 13A5 5 0 0 0 7.54 7.54L4.93 4.93A10 10 0 0 0 4.93 19.07L7.54 16.46A5 5 0 0 0 10 13Z" stroke="currentColor" stroke-width="2"/>
                            <path d="M14 11A5 5 0 0 0 16.46 16.46L19.07 19.07A10 10 0 0 0 19.07 4.93L16.46 7.54A5 5 0 0 0 14 11Z" stroke="currentColor" stroke-width="2"/>
                            <path d="M8 21L16 3" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </div>
                    <div class="detection-info">
                        <span class="detection-title">本页链接检测</span>
                        <span class="detection-status" id="detection-status">正在扫描...</span>
                    </div>
                    <div class="detection-count" id="link-count">0</div>
                </div>
                <div class="detection-progress">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="actions-section">
            <button class="action-btn primary" id="quick-download">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M21 15V19A2 2 0 0 1 19 21H5A2 2 0 0 1 3 19V15" stroke="currentColor" stroke-width="2"/>
                    <polyline points="7,10 12,15 17,10" stroke="currentColor" stroke-width="2"/>
                    <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2"/>
                </svg>
                快速下载
            </button>
            <button class="action-btn secondary" id="open-manager">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M18 13V6A2 2 0 0 0 16 4H4A2 2 0 0 0 2 6V18A2 2 0 0 0 4 20H11" stroke="currentColor" stroke-width="2"/>
                    <polyline points="9,9 9,9 9,9" stroke="currentColor" stroke-width="2"/>
                    <path d="M15 18L18 21L22 17" stroke="currentColor" stroke-width="2"/>
                </svg>
                打开管理器
            </button>
        </div>

        <!-- Settings Toggle -->
        <div class="settings-section">
            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-title">启用链接检测</span>
                    <span class="setting-desc">检测页面中的直接下载链接</span>
                </div>
                <div class="toggle-switch" id="enable-detection-toggle">
                    <input type="checkbox" id="enable-detection" checked>
                    <label for="enable-detection"></label>
                </div>
            </div>
            
            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-title">智能分类</span>
                    <span class="setting-desc">根据文件类型自动分类</span>
                </div>
                <div class="toggle-switch" id="smart-category-toggle">
                    <input type="checkbox" id="smart-category" checked>
                    <label for="smart-category"></label>
                </div>
            </div>

            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-title">代理下载</span>
                    <span class="setting-desc">拦截浏览器下载并转发到HDM-X</span>
                </div>
                <div class="toggle-switch" id="enable-proxy-toggle">
                    <input type="checkbox" id="enable-proxy" checked>
                    <label for="enable-proxy"></label>
                </div>
            </div>

            <div class="setting-item clickable" id="extensions-setting">
                <div class="setting-info">
                    <span class="setting-title">文件扩展名</span>
                    <span class="setting-desc">配置要检测的文件类型</span>
                </div>
                <div class="setting-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
            </div>

            <div class="setting-item clickable" id="domains-setting">
                <div class="setting-info">
                    <span class="setting-title">白名单域名</span>
                    <span class="setting-desc">限制检测特定域名</span>
                </div>
                <div class="setting-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="version-info">
                <span id="extension-version">v2.0.0</span>
                <span class="separator">•</span>
                <span id="client-version">客户端未连接</span>
            </div>
            <div class="connection-status" id="connection-status">
                <span class="status-text">正在连接...</span>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">设置</h3>
                <button class="modal-close" id="modal-close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M18 6L6 18" stroke="currentColor" stroke-width="2"/>
                        <path d="M6 6L18 18" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Content will be dynamically inserted -->
            </div>
            <div class="modal-footer">
                <button class="modal-btn secondary" id="modal-cancel">取消</button>
                <button class="modal-btn primary" id="modal-save">保存</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #2196F3;
            margin-bottom: 5px;
        }
        
        .status {
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 12px;
            text-align: center;
        }
        
        .status.connected {
            background-color: #E8F5E8;
            color: #2E7D32;
            border: 1px solid #C8E6C9;
        }
        
        .status.disconnected {
            background-color: #FFEBEE;
            color: #C62828;
            border: 1px solid #FFCDD2;
        }
        
        .download-section {
            margin-bottom: 15px;
        }
        
        .input-group {
            margin-bottom: 10px;
        }
        
        label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        
        input[type="url"], input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            box-sizing: border-box;
        }
        
        .button {
            width: 100%;
            padding: 10px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-bottom: 8px;
        }
        
        .button:hover {
            background-color: #1976D2;
        }
        
        .button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        .button.secondary {
            background-color: #757575;
        }
        
        .button.secondary:hover {
            background-color: #616161;
        }
        
        .message {
            padding: 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-top: 10px;
            display: none;
        }
        
        .message.success {
            background-color: #E8F5E8;
            color: #2E7D32;
            border: 1px solid #C8E6C9;
        }
        
        .message.error {
            background-color: #FFEBEE;
            color: #C62828;
            border: 1px solid #FFCDD2;
        }
        
        .quick-actions {
            border-top: 1px solid #eee;
            padding-top: 15px;
            margin-top: 15px;
        }
        
        .quick-actions h4 {
            margin: 0 0 10px 0;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">HDM X</div>
        <div id="status" class="status disconnected">连接状态检查中...</div>
    </div>
    
    <div class="download-section">
        <div class="input-group">
            <label for="downloadUrl">下载链接:</label>
            <input type="url" id="downloadUrl" placeholder="输入要下载的URL">
        </div>
        
        <div class="input-group">
            <label for="filename">文件名 (可选):</label>
            <input type="text" id="filename" placeholder="自动检测">
        </div>
        
        <button id="downloadBtn" class="button" disabled>添加下载</button>
    </div>
    
    <div class="quick-actions">
        <h4>快速操作</h4>
        <button id="downloadCurrentPage" class="button secondary">下载当前页面</button>
        <button id="testConnection" class="button secondary">测试连接</button>
    </div>
    
    <div id="message" class="message"></div>
    
    <script src="popup.js"></script>
</body>
</html>
